version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - ALLOWED_ORIGINS=*
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
